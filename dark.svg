    <text x="730" y="374" fill="#F8FAFC">Node.js, Express, Java, MongoDB, Flask</text>

    <!-- Seção Contatos -->
    <text x="460" y="415" fill="#C084FC" font-weight="bold">- Contact</text>

    <text x="460" y="442" fill="#22D3EE">Grid.LinkedIn</text>
    <text x="575" y="442" fill="#64748B">...............................</text>
    <text x="730" y="442" fill="#38BDF8">in/leonardo-rodrigues-617a78298</text>

    <text x="460" y="470" fill="#22D3EE">Grid.GitHub</text>
    <text x="575" y="470" fill="#64748B">...............................</text>
    <text x="730" y="470" fill="#38BDF8">@LCRodriguess</text>

    <text x="460" y="498" fill="#22D3EE">Grid.Instagram</text>
    <text x="575" y="498" fill="#64748B">...............................</text>
    <text x="730" y="498" fill="#38BDF8">@leonard0_rodriguess</text>

    <text x="460" y="526" fill="#22D3EE">Grid.Twitter/X</text>
    <text x="575" y="526" fill="#64748B">...............................</text>
    <text x="730" y="526" fill="#38BDF8">@Leonardo_Rodri_</text>
  </g>

  <!-- Rodapé do Terminal com Cursor Piscante -->
  <text x="460" y="568" font-size="12" fill="#94A3B8">
    &gt; Conectando pessoas e tecnologia através de software
    <tspan fill="#22D3EE">_
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </tspan>
  </text>
</svg>
